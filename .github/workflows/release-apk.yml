name: Build quickfile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: 'luci-app-quickfile'

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gcc-multilib g++-multilib \
            gettext git libssl-dev libncurses5-dev libncursesw5-dev python3 python3-pip rsync unzip zlib1g-dev

      - name: Download OpenWrt 25.12 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          wget $SDK_URL -O openwrt-sdk.tar.xz
          mkdir sdk
          tar -xf openwrt-sdk.tar.xz --strip-components=1 -C sdk
          mv luci-app-quickfile sdk/package/luci-app-quickfile

      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache OpenWrt dl
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: ${{ runner.os }}-openwrt-sdk-dl-${{ hashFiles('sdk/include/kernel-*') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-sdk-dl-

      - name: Generate Configuration
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" > .config
          make defconfig

      - name: Compile Package
        working-directory: sdk
        run: |
          make package/luci-app-quickfile/compile V=s -j$(nproc) || make package/luci-app-quickfile/compile V=s -j1

      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/packages/ -type f -name "*.apk" -exec cp {} output/ \;

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
