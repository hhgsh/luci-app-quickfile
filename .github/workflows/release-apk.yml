name: Build quickfile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: 'luci-app-quickfile'

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gcc-multilib g++-multilib \
            gettext git libssl-dev libncurses5-dev libncursesw5-dev python3 python3-pip rsync unzip zlib1g-dev zstd

      # 动态获取 25.12 最新 SDK 链接，解决 404 问题
      - name: Setup OpenWrt 25.12 SDK
        run: |
          SDK_URL=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)
          FULL_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}"
          echo "Downloading SDK from: ${FULL_URL}"
          wget "$FULL_URL" -O openwrt-sdk.tar.zst
          mkdir sdk
          tar --zstd -xf openwrt-sdk.tar.zst --strip-components=1 -C sdk
          mv luci-app-quickfile sdk/package/luci-app-quickfile

      - name: Generate Configuration
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" > .config
          make defconfig

      - name: Compile Package
        working-directory: sdk
        run: |
          make package/luci-app-quickfile/compile V=s IGNORE_ERRORS=m -j$(nproc) || make package/luci-app-quickfile/compile V=s IGNORE_ERRORS=m -j1

      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/ -type f -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-quickfile-25.12-apk
          path: output/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
