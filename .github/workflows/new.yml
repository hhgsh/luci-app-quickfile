name: Build quickfile2.x

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. 安装 Rust 环境与 cross 交叉编译工具
      - name: Install Rust and Cross
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --git https://github.com/cross-rs/cross

      # 2. 缓存 Cargo 依赖（大幅提速二次构建）
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 3. 极速交叉编译 Rust 核心二进制
      - name: Build Quickfile Core
        run: |
          if [ -d "quickfile" ]; then
            cd quickfile
          fi
          cross build --target x86_64-unknown-linux-musl --release

      # 4. 下载并配置 OpenWrt SDK
      - name: Setup OpenWrt SDK
        run: |
          SDK_URL=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)
          wget "https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}" -O openwrt-sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf openwrt-sdk.tar.zst --strip-components=1 -C sdk
          
          # 将源码移入 SDK package 目录
          cp -r $GITHUB_WORKSPACE sdk/package/luci-app-quickfile

      # 5. 更新 Feeds 并设置最小化配置
      - name: Update Feeds and Config
        working-directory: sdk
        run: |
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" > .config
          make defconfig

      # 6. 打包 APK（由于二进制已编好，此步骤几秒内即可完成）
      - name: Compile Package
        working-directory: sdk
        run: |
          make package/luci-app-quickfile/compile V=s -j$(nproc)

      # 7. 收集生成的 APK 文件
      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/ -type f -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      # 8. 发布 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v25.12-$(date +'%Y%m%d-%H%M')"
          name: "Quickfile OpenWrt 25.12 APK"
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
