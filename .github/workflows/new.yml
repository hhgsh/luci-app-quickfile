name: Build quickfile 2.0x

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. 缓存 Cargo 依赖
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-2.0.5

      # 2. 下载 2.0.5 源码包并在 Ubuntu 原生环境中几分钟完成 Rust 极速编译
      - name: Build Rust Binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          wget https://r2.cooluc.com/source/quickfile-src-2.0.5.tar.xz
          tar -xf quickfile-src-2.0.5.tar.xz
          cd quickfile-src-2.0.5
          cargo build --release --target x86_64-unknown-linux-musl

      # 3. 准备 OpenWrt SDK 并复制预编译好的二进制文件
      - name: Setup OpenWrt SDK
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 rsync unzip zlib1g-dev zstd
          
          SDK_URL=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)
          wget "https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}" -O openwrt-sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf openwrt-sdk.tar.zst --strip-components=1 -C sdk
          
          # 复制当前仓库文件到 SDK package 目录
          cp -r $GITHUB_WORKSPACE sdk/package/luci-app-quickfile
          if [ -d "sdk/package/luci-app-quickfile/quickfile" ]; then
            cp -r sdk/package/luci-app-quickfile/quickfile sdk/package/quickfile
          fi
          
          # 将编译好的二进制强塞给 SDK
          cp $GITHUB_WORKSPACE/quickfile-src-2.0.5/target/x86_64-unknown-linux-musl/release/quickfile sdk/package/quickfile/quickfile
          chmod +x sdk/package/quickfile/quickfile

      # 4. 配置 SDK 并极速打包
      - name: Package APK
        working-directory: sdk
        run: |
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci
          echo "CONFIG_PACKAGE_quickfile=m" > .config
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" >> .config
          make defconfig
          
          make package/quickfile/compile V=s
          make package/luci-app-quickfile/compile V=s

      # 5. 收集 APK 结果
      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/ -type f \( \
            -name "quickfile*.apk" -o \
            -name "luci-app-quickfile*.apk" -o \
            -name "luci-i18n-quickfile*.apk" \
          \) -exec cp {} output/ \;
          ls -la output/

      # 6. 发布 Release
      - name: Generate Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${github.ref_name}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v25.12-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Quickfile OpenWrt 25.12 APK (${{ env.RELEASE_TAG }})"
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
