name: Build quickfile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: 'luci-app-quickfile'

      # 1. 快速清理无用大型套件（释放空间与提升性能）
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      # 2. 安装必要构建依赖
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gcc-multilib g++-multilib \
            gettext git libssl-dev libncurses5-dev libncursesw5-dev \
            python3 python3-pip rsync unzip zlib1g-dev zstd ccache

      # 3. 缓存 Rust / Cargo 依赖 (极速加速下一次编译)
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('luci-app-quickfile/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 4. 下载并解压 SDK
      - name: Setup OpenWrt 25.12 SDK
        run: |
          SDK_URL=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/ | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)
          FULL_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_URL}"
          echo "Downloading SDK from: ${FULL_URL}"
          wget "$FULL_URL" -O openwrt-sdk.tar.zst

          mkdir -p sdk
          tar --zstd -xf openwrt-sdk.tar.zst --strip-components=1 -C sdk
          
          # 复制源码至 SDK 目录
          cp -r luci-app-quickfile sdk/package/luci-app-quickfile

      # 5. 更新并安装 Feeds（包含 lang/rust 等必要依赖包）
      - name: Update and Install Feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

      # 6. 配置仅编译当前插件
      - name: Generate Configuration
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_quickfile=m" > .config
          echo "CONFIG_PACKAGE_luci-app-quickfile=m" >> .config
          make defconfig

      # 7. 精确编译插件（使用多线程，避免扫描无关内核包）
      - name: Compile Package
        working-directory: sdk
        run: |
          make package/luci-app-quickfile/compile V=s -j$(nproc)

      # 8. 收集 APK 结果
      - name: Organize Artifacts
        run: |
          mkdir -p output
          find sdk/bin/ -type f -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      # 9. 发布 Release
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v25.12-$(date +'%Y%m%d-%H%M')"
          name: "Quickfile OpenWrt 25.12 APK"
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
